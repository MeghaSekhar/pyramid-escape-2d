<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pyramid of 20 Trials</title>
  <style>
    body { background: #0f0d0a; color: #f0c070; font-family: monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    #game-container { border: 4px solid #b8860b; background: #1a150e; padding: 20px; box-shadow: 0 0 20px #000; text-align: center; width: 600px; }
    canvas { background: #050403; border: 2px solid #554020; margin-bottom: 15px; }
    .hud { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 10px; }
    #ui-box { background: #2a2015; border: 1px solid #8b6508; padding: 10px; margin-top: 10px; min-height: 80px; }
    input { background: #0f0d0a; border: 1px solid #b8860b; color: #fff; padding: 8px; font-family: monospace; width: 70%; }
    button { background: #b8860b; border: none; color: #000; padding: 8px 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #ffd700; }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <span id="chamber-title">Chamber 1 / 20</span>
      <span>Status: TRAPPED</span>
    </div>
    <canvas id="canvas" width="560" height="300"></canvas>
    <div id="ui-box">
      <p id="dialogue">Maya: "The heavy stone door slammed shut behind us..."</p>
      <div id="controls"></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
