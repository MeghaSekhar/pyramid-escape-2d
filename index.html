<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramid Escape: Chamber 1</title>
  <style>
    body { 
      background: #1a1410; 
      color: #f3e5ab; 
      font-family: monospace; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
    }
    .game-card { 
      background: #2c221a; 
      border: 3px solid #d4af37; 
      padding: 24px; 
      border-radius: 8px; 
      width: 380px; 
      text-align: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    }
    h1 { color: #d4af37; font-size: 1.4rem; margin-bottom: 8px; }
    p { font-size: 0.9rem; line-height: 1.4; color: #e0d0b0; }
    .status-box { 
      background: #120e0b; 
      border: 1px solid #8b5a2b; 
      padding: 12px; 
      margin: 16px 0; 
      font-size: 1.1rem; 
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .basin-display {
      border-top: 1px dashed #8b5a2b;
      padding-top: 6px;
      margin-top: 4px;
      color: #d4af37;
      font-weight: bold;
    }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { 
      background: #8b5a2b; 
      color: #fff; 
      border: 1px solid #d4af37; 
      padding: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      font-weight: bold; 
      border-radius: 4px; 
    }
    button:hover { background: #d4af37; color: #1a1410; }
    .full-btn { grid-column: span 2; background: #2e6f40; }
    .full-btn:hover { background: #3eb460; color: #fff; }
    .log { margin-top: 12px; font-size: 0.85rem; color: #ffab40; min-height: 24px; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🏺 CHAMBER 1: THE WATER SCALE</h1>
    <p>The granite gate slams shut! To unlock Door 1 without triggering the dart trap, pour <strong>exactly 4 Liters</strong> into the scale basin.</p>

    <div class="status-box">
      <div>5L Urn: <span id="urn5">0</span> / 5 L</div>
      <div>3L Urn: <span id="urn3">0</span> / 3 L</div>
      <div class="basin-display">⚖️ Scale Basin: <span id="basin">0</span> L</div>
    </div>

    <div class="controls">
      <button onclick="fill5()">Fill 5L Urn</button>
      <button onclick="fill3()">Fill 3L Urn</button>
      <button onclick="pour5to3()">Pour 5L ➔ 3L</button>
      <button onclick="pour3to5()">Pour 3L ➔ 5L</button>
      <button onclick="empty5()">Empty 5L Urn</button>
      <button onclick="empty3()">Empty 3L Urn</button>
      <button class="full-btn" onclick="pour5ToBasin()">Pour 5L ➔ Basin</button>
      <button class="full-btn" style="background:#8b2b2b;" onclick="resetBasin()">Empty Basin</button>
    </div>

    <div class="log" id="logMsg"></div>
  </div>

  <script>
    // ==========================================
    // 🔊 WEB AUDIO SYNTHESIZER
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); osc.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playPourSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(320, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain); osc.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    }

    function playSuccessSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain); osc.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function playTrapSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.connect(gain); osc.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    }

    // ==========================================
    // 🎮 GAME STATE
    // ==========================================
    let u5 = 0, u3 = 0, basin = 0;

    function updateUI() {
      document.getElementById('urn5').innerText = u5;
      document.getElementById('urn3').innerText = u3;
      document.getElementById('basin').innerText = basin;
    }

    function fill5() { u5 = 5; updateUI(); playPourSound(); log("Filled 5L urn."); }
    function fill3() { u3 = 3; updateUI(); playPourSound(); log("Filled 3L urn."); }
    function empty5() { u5 = 0; updateUI(); playClickSound(); log("Emptied 5L urn onto ground."); }
    function empty3() { u3 = 0; updateUI(); playClickSound(); log("Emptied 3L urn onto ground."); }

    function pour5to3() {
      let space = 3 - u3;
      let transfer = Math.min(u5, space);
      u5 -= transfer; u3 += transfer;
      updateUI(); playPourSound();
      log(`Poured ${transfer}L from 5L to 3L urn.`);
    }

    function pour3to5() {
      let space = 5 - u5;
      let transfer = Math.min(u3, space);
      u3 -= transfer; u5 += transfer;
      updateUI(); playPourSound();
      log(`Poured ${transfer}L from 3L to 5L urn.`);
    }

    function pour5ToBasin() {
      if (u5 === 0) {
        log("The 5L urn is empty!");
        playClickSound();
        return;
      }
      basin += u5;
      u5 = 0;
      updateUI();
      
      if (basin === 4) {
        playSuccessSound();
        log("🎉 SUCCESS! The scale locks into place and the stone door rumbles open!");
      } else if (basin > 4) {
        playTrapSound();
        log(`🚨 TRAP TRIGGERED! You poured ${basin}L (overflow!). Resetting basin...`);
        basin = 0;
        updateUI();
      } else {
        playPourSound();
        log(`Poured water into scale basin. Total in basin: ${basin}L.`);
      }
    }

    function resetBasin() {
      basin = 0;
      updateUI();
      playClickSound();
      log("Scale basin emptied.");
    }

    function log(msg) { 
      document.getElementById('logMsg').innerText = msg; 
    }
  </script>
</body>
</html>
