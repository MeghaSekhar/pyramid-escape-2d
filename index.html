<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramid Escape: Chamber 1</title>
  <style>
    body { 
      background: #1a1410; 
      color: #f3e5ab; 
      font-family: monospace; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
      box-sizing: border-box;
    }
    .game-card { 
      background: #2c221a; 
      border: 3px solid #d4af37; 
      padding: 24px; 
      border-radius: 8px; 
      width: 440px; 
      text-align: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    }
    h1 { color: #d4af37; font-size: 1.4rem; margin-bottom: 8px; }
    p { font-size: 0.9rem; line-height: 1.4; color: #e0d0b0; }

    /* Visual Containers Section */
    .visual-containers {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      background: #120e0b;
      border: 1px solid #8b5a2b;
      padding: 20px 10px;
      margin: 16px 0;
      border-radius: 6px;
      min-height: 170px;
    }

    .container-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .vessel {
      width: 60px;
      border: 3px solid #d4af37;
      border-top: 1px dashed #d4af37;
      background: rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      border-radius: 0 0 6px 6px;
    }

    .vessel.urn5 { height: 120px; }
    .vessel.urn3 { height: 80px; }
    .vessel.basin { height: 100px; width: 90px; border-color: #ffd700; }

    .water-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
      transition: height 0.4s ease-in-out;
      box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
    }

    .vessel-label {
      font-size: 0.8rem;
      color: #e0d0b0;
      font-weight: bold;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { 
      background: #8b5a2b; 
      color: #fff; 
      border: 1px solid #d4af37; 
      padding: 10px; 
      cursor: pointer; 
      font-family: inherit; 
      font-weight: bold; 
      border-radius: 4px; 
    }
    button:hover { background: #d4af37; color: #1a1410; }
    .full-btn { grid-column: span 2; background: #2e6f40; }
    .full-btn:hover { background: #3eb460; color: #fff; }
    .log { margin-top: 12px; font-size: 0.85rem; color: #ffab40; min-height: 24px; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🏺 CHAMBER 1: THE WATER SCALE</h1>
    <p>The granite gate slams shut! Pour <strong>exactly 4 Liters</strong> into the scale basin to unlock Door 1.</p>

    <!-- Visual Water Containers -->
    <div class="visual-containers">
      <div class="container-wrapper">
        <div class="vessel urn5">
          <div id="fill5" class="water-fill"></div>
        </div>
        <div class="vessel-label">5L Urn (<span id="val5">0</span>/5L)</div>
      </div>

      <div class="container-wrapper">
        <div class="vessel urn3">
          <div id="fill3" class="water-fill"></div>
        </div>
        <div class="vessel-label">3L Urn (<span id="val3">0</span>/3L)</div>
      </div>

      <div class="container-wrapper">
        <div class="vessel basin">
          <div id="fillBasin" class="water-fill"></div>
        </div>
        <div class="vessel-label">⚖️ Basin (<span id="valBasin">0</span>/4L)</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="fill5()">Fill 5L Urn</button>
      <button onclick="fill3()">Fill 3L Urn</button>
      <button onclick="pour5to3()">Pour 5L ➔ 3L</button>
      <button onclick="pour3to5()">Pour 3L ➔ 5L</button>
      <button onclick="empty5()">Empty 5L Urn</button>
      <button onclick="empty3()">Empty 3L Urn</button>
      <button class="full-btn" onclick="pour5ToBasin()">Pour 5L ➔ Basin</button>
      <button class="full-btn" style="background:#8b2b2b;" onclick="resetBasin()">Empty Basin</button>
    </div>

    <div class="log" id="logMsg"></div>
  </div>

  <script>
    // ==========================================
    // 🔊 WEB AUDIO SYNTHESIZER
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); osc.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playPourSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(320, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain); osc.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    }

    function playSuccessSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain); osc.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function playTrapSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.connect(gain); osc.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    }

    // ==========================================
    // 🎮 GAME STATE & VISUAL FILL ANIMATION
    // ==========================================
    let u5 = 0, u3 = 0, basin = 0;

    function updateUI() {
      // Numerical values
      document.getElementById('val5').innerText = u5;
      document.getElementById('val3').innerText = u3;
      document.getElementById('valBasin').innerText = basin;

      // Visual fill percentages
      document.getElementById('fill5').style.height = `${(u5 / 5) * 100}%`;
      document.getElementById('fill3').style.height = `${(u3 / 3) * 100}%`;
      document.getElementById('fillBasin').style.height = `${(basin / 4) * 100}%`;
    }

    function fill5() { u5 = 5; updateUI(); playPourSound(); log("Filled 5L urn."); }
    function fill3() { u3 = 3; updateUI(); playPourSound(); log("Filled 3L urn."); }
    function empty5() { u5 = 0; updateUI(); playClickSound(); log("Emptied 5L urn."); }
    function empty3() { u3 = 0; updateUI(); playClickSound(); log("Emptied 3L urn."); }

    function pour5to3() {
      let space = 3 - u3;
      let transfer = Math.min(u5, space);
      u5 -= transfer; u3 += transfer;
      updateUI(); playPourSound();
      log(`Poured ${transfer}L from 5L to 3L urn.`);
    }

    function pour3to5() {
      let space = 5 - u5;
      let transfer = Math.min(u3, space);
      u3 -= transfer; u5 += transfer;
      updateUI(); playPourSound();
      log(`Poured ${transfer}L from 3L to 5L urn.`);
    }

    function pour5ToBasin() {
      if (u5 === 0) {
        log("The 5L urn is empty!");
        playClickSound();
        return;
      }
      basin += u5;
      u5 = 0;
      updateUI();
      
      if (basin === 4) {
        playSuccessSound();
        log("🎉 SUCCESS! The scale locks into place and the stone door rumbles open!");
      } else if (basin > 4) {
        playTrapSound();
        log(`🚨 TRAP TRIGGERED! You poured ${basin}L (overflow!). Resetting basin...`);
        basin = 0;
        updateUI();
      } else {
        playPourSound();
        log(`Poured water into scale basin. Total in basin: ${basin}L.`);
      }
    }

    function resetBasin() {
      basin = 0;
      updateUI();
      playClickSound();
      log("Scale basin emptied.");
    }

    function log(msg) { 
      document.getElementById('logMsg').innerText = msg; 
    }

    // Initial load
    updateUI();
  </script>
</body>
</html>
